name: Fetch BarShift Assets

on:
  push:
    paths:
      - '.github/workflows/fetch-bar-assets.yml'
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare folders
        run: |
          mkdir -p Assets/Resources/Models/Characters/Animations
          mkdir -p Assets/Resources/Models/Characters/Skins
          mkdir -p Assets/Resources/Models/Bar

      - name: Download CC0 character assets
        run: |
          curl -L --fail -o Assets/Resources/Models/Characters/characterMedium.fbx "https://raw.githubusercontent.com/sinanata/unity-3d-to-sprite-baker/main/Assets/Demo/Resources/Models/characterMedium.fbx"
          curl -L --fail -o Assets/Resources/Models/Characters/Animations/idle.fbx "https://raw.githubusercontent.com/sinanata/unity-3d-to-sprite-baker/main/Assets/Demo/Resources/Models/Animations/idle.fbx"
          curl -L --fail -o Assets/Resources/Models/Characters/Animations/jump.fbx "https://raw.githubusercontent.com/sinanata/unity-3d-to-sprite-baker/main/Assets/Demo/Resources/Models/Animations/jump.fbx"
          curl -L --fail -o Assets/Resources/Models/Characters/Skins/skaterMaleA.png "https://raw.githubusercontent.com/sinanata/unity-3d-to-sprite-baker/main/Assets/Demo/Resources/Models/Skins/skaterMaleA.png"
          curl -L --fail -o Assets/Resources/Models/Characters/Skins/skaterFemaleA.png "https://raw.githubusercontent.com/sinanata/unity-3d-to-sprite-baker/main/Assets/Demo/Resources/Models/Skins/skaterFemaleA.png"

      - name: Download CC0 bar props
        run: |
          curl -L --fail -o Assets/Resources/Models/Bar/soda-bottle.obj "https://raw.githubusercontent.com/gabeochoa/pharmasea/main/resources/models/kennynl/sodaBottle.obj"
          curl -L --fail -o Assets/Resources/Models/Bar/soda-bottle.mtl "https://raw.githubusercontent.com/gabeochoa/pharmasea/main/resources/models/kennynl/sodaBottle.mtl"
          curl -L --fail -o Assets/Resources/Models/Bar/glass.obj "https://raw.githubusercontent.com/gabeochoa/pharmasea/main/resources/models/kennynl/sodaGlass.obj"
          curl -L --fail -o Assets/Resources/Models/Bar/glass.mtl "https://raw.githubusercontent.com/gabeochoa/pharmasea/main/resources/models/kennynl/sodaGlass.mtl"

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: barshift-ready-assets
          path: Assets/Resources/Models
          if-no-files-found: error
